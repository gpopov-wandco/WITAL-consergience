{% extends "base.html" %}
{% block title %}{{ t.set_password }}{% endblock %}
{% block content %}
<h1>{{ t.set_password }}</h1>
{% if email %}<p class="meta">{{ email }}</p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}" class="card stack narrow">
  <div class="field"><label for="password">{{ t.password }} (min. 12)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
  <button type="submit">{{ t.save }}</button>
</form>
{% endblock %}
