# Guest-facing system texts, Russian (вы). Legal texts carry status draft_unreviewed (C10).
lang: ru
register: вы
texts:
  disclosure:
    status: draft_unreviewed
    text: "Добро пожаловать. Я ИИ-ассистент отеля {hotel}, а не человек. Я отвечаю на вопросы о заезде, парковке, завтраке и наличии номеров. Если вы хотите поговорить с сотрудником, напишите «сотрудник». Политика конфиденциальности: {privacy_url}"
  degraded:
    text: "Ассистент сейчас доступен только частично. Ваше сообщение передано на ресепшен; вы можете связаться с ним по телефону {phone}."
  handoff_ack:
    text: "Я передал ваше сообщение команде отеля. Здесь вам ответит сотрудник."
  handoff_ack_with_window:
    text: "Я передал ваше сообщение команде отеля. Обычно ответ приходит в течение {window}."
  staff_active_ack:
    text: "Вашим вопросом занимается сотрудник. Ассистент пока приостановлен."
  emergency:
    status: draft_unreviewed
    text: "При пожаре или неотложной медицинской помощи немедленно звоните 112, при угрозе со стороны других людей — 110. Я сейчас оповещаю команду отеля."
  opt_out_confirm:
    status: draft_unreviewed
    text: "Вы больше не будете получать от нас автоматические сообщения. Вы по-прежнему можете задавать вопросы здесь."
  off_topic_redirect:
    text: "С этим я помочь не могу. Я отвечаю на вопросы об отеле, заезде и вашем бронировании."
  off_topic_person:
    text: "С этим я помочь не могу. Хотите поговорить с сотрудником?"
  card_warning:
    text: "Пожалуйста, не отправляйте в чат данные карты или документов. Я их не сохранил. По вопросам оплаты обратитесь на ресепшен."
  other_guest_refusal:
    text: "Я не могу давать информацию о других гостях, в том числе родственникам или органам власти. Пожалуйста, обратитесь на ресепшен."
  unsupported_media:
    text: "Я не могу распознать голосовые сообщения, изображения и файлы. Пожалуйста, коротко опишите вопрос текстом или напишите «сотрудник»."
  verification_ask:
    text: "Для этого мне нужны номер бронирования, фамилия и дата заезда."
  verification_failed:
    text: "Эти данные не совпадают ни с одним бронированием. Проверьте номер бронирования, фамилию и дату заезда."
  verification_locked:
    text: "Слишком много попыток. Пожалуйста, свяжитесь с ресепшен по телефону {phone}."
  unsupported_language:
    text: "Я могу отвечать на этих языках: {languages}. Если вы предпочитаете общение с человеком, напишите «сотрудник»."
  person_offer:
    text: "Передать ваш вопрос сотруднику?"
  demo_banner:
    text: "Демо-режим: сценарный ответчик, а не языковая модель."
  availability_fresh:
    text: "Система бронирования сейчас показывает: {summary}."
  availability_cached:
    text: "По состоянию на {time}: {summary}."
  availability_calendar:
    text: "По нашему календарю (обновлён {date}): {summary}. Пожалуйста, подтвердите наличие на ресепшен."
  availability_unknown:
    text: "Я уточню наличие номеров на ресепшен и сообщу вам. Назовите, пожалуйста, даты заезда и выезда и количество гостей."
  availability_indicative:
    text: "Цены ориентировочные; бронирование оформляется по ссылке или через ресепшен."
  availability_ask_dates:
    text: "На какие даты вы хотите остановиться (заезд и выезд)?"
  availability_ask_guests:
    text: "Сколько взрослых и детей?"
  booking_link_intro:
    text: "Ссылка для бронирования с {arrival} по {departure}, взрослых: {adults}: {url}"
  group_lead:
    text: "Для запросов от пяти номеров ресепшен подготовит предложение. Я передал ваш запрос."
  complaint_ack:
    text: "Мне очень жаль. Назовите, пожалуйста, номер комнаты и что именно не в порядке, чтобы команда сразу этим занялась."
  feedback_thanks:
    text: "Спасибо за ваш отзыв."
  review_link:
    text: "Если хотите, вы можете оставить отзыв здесь: {url}"
  allergy_severe:
    text: "При тяжёлой аллергии, пожалуйста, поговорите с командой напрямую; я передаю ваши данные."
  eta_ask:
    text: "Когда вы планируете прибыть? Укажите, пожалуйста, время."
  eta_saved:
    text: "Спасибо, я записал время прибытия: {eta}."
  kb_miss:
    text: "У меня нет этой информации. Я передаю ваш вопрос команде отеля."
  same_question:
    text: "Я не могу ответить на ваш вопрос лучше. Хотите поговорить с сотрудником?"
  request_recorded:
    text: "Я записал ваш запрос для команды. Он не подтверждён, пока не ответит ресепшен."
  voice_disclosure:
    status: draft_unreviewed
    text: "Здравствуйте, это цифровой ассистент отеля {hotel}. Я система искусственного интеллекта, а не человек. Разговор не записывается; текстовая версия хранится {days} дней. Политика конфиденциальности размещена на сайте отеля. Скажите «сотрудник» в любой момент, чтобы связаться с человеком."
  voice_filler:
    text: "Одну минуту, пожалуйста."
  voice_transfer:
    text: "Соединяю вас с ресепшен."
  voice_callback:
    text: "Ресепшен сейчас недоступен. Я запишу обратный звонок; назовите, пожалуйста, ваше имя."
  voice_goodbye:
    text: "Спасибо за звонок. До свидания."
buttons:
  person: Сотрудник
  book: Забронировать
  eta: Время заезда
  directions: Как добраться
  parking: Парковка
  breakfast: Завтрак
  "yes": Да
  "no": Нет
  more: Ещё
  verify: Проверить бронь
  privacy: Конфиденциальность
