# Guest-facing system texts, Ukrainian (ви), written natively. Legal texts carry status draft_unreviewed (C10).
lang: uk
register: ви
texts:
  disclosure:
    status: draft_unreviewed
    text: "Вітаємо. Я ШІ-асистент готелю {hotel}, а не людина. Я відповідаю на запитання про заїзд, паркування, сніданок і наявність номерів. Якщо ви хочете поговорити з працівником, напишіть «працівник». Політика конфіденційності: {privacy_url}"
  degraded:
    text: "Асистент зараз доступний лише частково. Ваше повідомлення передано на рецепцію; ви можете зв'язатися з нею за телефоном {phone}."
  handoff_ack:
    text: "Я передав ваше повідомлення команді готелю. Тут вам відповість працівник."
  handoff_ack_with_window:
    text: "Я передав ваше повідомлення команді готелю. Зазвичай відповідь надходить протягом {window}."
  staff_active_ack:
    text: "Вашим запитом займається працівник. Асистент поки що призупинений."
  emergency:
    status: draft_unreviewed
    text: "У разі пожежі або потреби в невідкладній медичній допомозі негайно телефонуйте 112, у разі загрози з боку інших людей — 110. Я зараз повідомляю команду готелю."
  opt_out_confirm:
    status: draft_unreviewed
    text: "Ви більше не отримуватимете від нас автоматичних повідомлень. Ви й надалі можете ставити запитання тут."
  off_topic_redirect:
    text: "З цим я допомогти не можу. Я відповідаю на запитання про готель, заїзд і ваше бронювання."
  off_topic_person:
    text: "З цим я допомогти не можу. Хочете поговорити з працівником?"
  card_warning:
    text: "Будь ласка, не надсилайте в чат дані картки чи документів. Я їх не зберіг. Щодо оплати зверніться на рецепцію."
  other_guest_refusal:
    text: "Я не можу надавати інформацію про інших гостей, зокрема родичам чи органам влади. Будь ласка, зверніться на рецепцію."
  unsupported_media:
    text: "Я не можу розпізнати голосові повідомлення, зображення та файли. Будь ласка, коротко опишіть запитання текстом або напишіть «працівник»."
  verification_ask:
    text: "Для цього мені потрібні номер бронювання, прізвище та дата заїзду."
  verification_failed:
    text: "Ці дані не збігаються з жодним бронюванням. Перевірте, будь ласка, номер бронювання, прізвище та дату заїзду."
  verification_locked:
    text: "Забагато спроб. Будь ласка, зв'яжіться з рецепцією за телефоном {phone}."
  unsupported_language:
    text: "Я можу відповідати цими мовами: {languages}. Якщо ви бажаєте спілкуватися з людиною, напишіть «працівник»."
  person_offer:
    text: "Передати ваше запитання працівникові?"
  demo_banner:
    text: "Демо-режим: сценарний відповідач, а не мовна модель."
  availability_fresh:
    text: "Система бронювання зараз показує: {summary}."
  availability_cached:
    text: "Станом на {time}: {summary}."
  availability_calendar:
    text: "За нашим календарем (оновлено {date}): {summary}. Будь ласка, підтвердьте наявність на рецепції."
  availability_unknown:
    text: "Я уточню наявність номерів на рецепції та повідомлю вам. Назвіть, будь ласка, дати заїзду й виїзду та кількість гостей."
  availability_indicative:
    text: "Ціни орієнтовні; бронювання здійснюється за посиланням або через рецепцію."
  availability_ask_dates:
    text: "На які дати ви хочете зупинитися (заїзд і виїзд)?"
  availability_ask_guests:
    text: "Скільки дорослих і дітей?"
  booking_link_intro:
    text: "Посилання для бронювання з {arrival} до {departure}, дорослих: {adults}: {url}"
  group_lead:
    text: "Для запитів від п'яти номерів рецепція підготує пропозицію. Я передав ваш запит."
  complaint_ack:
    text: "Мені дуже шкода. Назвіть, будь ласка, номер кімнати та що саме не так, щоб команда одразу цим зайнялася."
  feedback_thanks:
    text: "Дякуємо за ваш відгук."
  review_link:
    text: "Якщо бажаєте, ви можете залишити відгук тут: {url}"
  allergy_severe:
    text: "У разі тяжкої алергії, будь ласка, поговоріть з командою напряму; я передаю ваші дані."
  eta_ask:
    text: "Коли ви плануєте прибути? Вкажіть, будь ласка, час."
  eta_saved:
    text: "Дякую, я записав час прибуття: {eta}."
  kb_miss:
    text: "У мене немає цієї інформації. Я передаю ваше запитання команді готелю."
  same_question:
    text: "Я не можу відповісти на ваше запитання краще. Хочете поговорити з працівником?"
  request_recorded:
    text: "Я записав ваш запит для команди. Він не підтверджений, доки не відповість рецепція."
  voice_disclosure:
    status: draft_unreviewed
    text: "Добрий день, це цифровий асистент готелю {hotel}. Я система штучного інтелекту, а не людина. Розмова не записується; текстова версія зберігається {days} днів. Політика конфіденційності розміщена на сайті готелю. Скажіть «працівник» будь-коли, щоб зв'язатися з людиною."
  voice_filler:
    text: "Хвилинку, будь ласка."
  voice_transfer:
    text: "З'єдную вас із рецепцією."
  voice_callback:
    text: "Рецепція зараз недоступна. Я запишу зворотний дзвінок; назвіть, будь ласка, ваше ім'я."
  voice_goodbye:
    text: "Дякуємо за дзвінок. До побачення."
  availability_handoff:
    text: "Я передав ваш запит ({summary}) на рецепцію. Зазвичай відповідь надходить протягом {window}."
  availability_handoff_no_window:
    text: "Я передав ваш запит ({summary}) на рецепцію. Працівник відповість вам тут."
  avail_request_summary:
    text: "{arrival} — {departure}, дорослих: {adults}, дітей: {children}"
  avail_room_free:
    text: "{room}: доступно"
  avail_room_free_price:
    text: "{room}: доступно від {price} за ніч ({total} за {nights} ноч.)"
  avail_room_none:
    text: "{room}: недоступно"
  avail_room_restricted:
    text: "{room}: {rule}"
  avail_rule_min_stay:
    text: "мінімальний термін проживання {nights} ноч."
  avail_rule_closed_arrival:
    text: "заїзд {date} неможливий"
  avail_rule_closed_departure:
    text: "виїзд {date} неможливий"
  avail_rule_max_occupancy:
    text: "не більше {max} осіб у номері"
  avail_rule_closed:
    text: "на ці дати зачинено"
  avail_alt_until:
    text: "Альтернатива: проживання до {date}"
  avail_alt_arrival:
    text: "Альтернатива: заїзд {date}"
  avail_alt_departure:
    text: "Альтернатива: виїзд {date}"
  avail_alt_rooms:
    text: "Альтернатива: {rooms} номери(ів)"
  avail_units_left:
    text: "Залишилося: {units}"
  avail_tax_incl:
    text: "включно з ПДВ"
  avail_tax_excl:
    text: "без ПДВ"
  avail_high_demand:
    text: "На ці дати ціну назве рецепція"
  avail_no_rooms:
    text: "На ці дати вільних номерів немає"
  avail_confirm_reception:
    text: "Будь ласка, підтвердьте наявність місць на рецепції"
  eta_window_saved:
    text: "Дякую, я записав «{window}» як час вашого прибуття. Рецепцію поінформовано."
  eta_window_no_booking:
    text: "Дякую за відповідь «{window}». Я не знаходжу бронювання за цим номером; назвіть, будь ласка, номер бронювання, прізвище та дату заїзду."
  upsell_offer_question:
    text: "Запросити це для вас на рецепції? Рецепція підтверджує запит; лише після цього він діє."
  upsell_declined_ack:
    text: "Гаразд, без проблем."

buttons:
  person: Працівник
  book: Забронювати
  eta: Час заїзду
  directions: Як дістатися
  parking: Паркування
  breakfast: Сніданок
  "yes": Так
  "no": Ні
  more: Ще
  verify: Перевірити бронь
  privacy: Конфіденційність
  upsell_yes: "Так, запросити"
  upsell_no: "Ні, дякую"
