      ru: "Ресепшен работает ежедневно с 07:00 до 22:00. Телефон +49 69 000000, e-mail reception@example.invalid. В другое время ночная служба доступна по номеру экстренной связи у входной двери."
      uk: "Рецепція працює щодня з 07:00 до 22:00. Телефон +49 69 000000, e-mail reception@example.invalid. В інший час нічна служба доступна за номером екстреного зв'язку біля вхідних дверей."
      tr: "Resepsiyon her gün 07:00 ile 22:00 arasında hizmet verir. Telefon +49 69 000000, e-posta reception@example.invalid. Bu saatler dışında gece servisine giriş kapısındaki acil numaradan ulaşılabilir."
      it: "La reception è presidiata ogni giorno dalle 07:00 alle 22:00. Telefono +49 69 000000, e-mail reception@example.invalid. Al di fuori di questi orari il servizio notturno è raggiungibile tramite il numero di emergenza alla porta d'ingresso."
  - key: checkin
    value: {from: "15:00", until: "22:00", early_checkin: "on_request", early_fee_cents: 0}
    text:
      de: "Check-in ist ab 15:00 Uhr möglich, an der Rezeption bis 22:00 Uhr. Ein früherer Check-in ist nur nach Rücksprache mit der Rezeption möglich und wird nicht garantiert."
      en: "Check-in is possible from 15:00, at the reception until 22:00. Earlier check-in is only possible after consultation with the reception and is not guaranteed."
      ru: "Заезд возможен с 15:00, на ресепшен до 22:00. Более ранний заезд возможен только по согласованию с ресепшен и не гарантируется."
      uk: "Заїзд можливий з 15:00, на рецепції до 22:00. Раніший заїзд можливий лише за погодженням з рецепцією і не гарантується."
      tr: "Giriş 15:00'ten itibaren, resepsiyonda 22:00'ye kadar yapılabilir. Daha erken giriş yalnızca resepsiyonla görüşülerek mümkündür ve garanti edilmez."
      it: "Il check-in è possibile dalle 15:00, alla reception fino alle 22:00. Un check-in anticipato è possibile solo previo accordo con la reception e non è garantito."
  - key: checkout
    value: {until: "11:00", late_checkout: "on_request", late_fee_cents: 2000}
    text:
      de: "Check-out ist bis 11:00 Uhr. Ein späterer Check-out bis 14:00 Uhr kostet 20 EUR und ist nur möglich, wenn die Rezeption ihn bestätigt."
      en: "Check-out is until 11:00. Late check-out until 14:00 costs EUR 20 and is only possible when the reception confirms it."
      ru: "Выезд до 11:00. Поздний выезд до 14:00 стоит 20 EUR и возможен только при подтверждении ресепшен."
      uk: "Виїзд до 11:00. Пізній виїзд до 14:00 коштує 20 EUR і можливий лише за підтвердженням рецепції."
      tr: "Çıkış saati 11:00'e kadardır. 14:00'e kadar geç çıkış 20 EUR'dur ve yalnızca resepsiyon onaylarsa mümkündür."
      it: "Il check-out è entro le 11:00. Il check-out posticipato fino alle 14:00 costa 20 EUR ed è possibile solo se confermato dalla reception."
  - key: late_arrival
    value: {latest_reception: "22:00", key_safe: true, after_hours_contact: "+49 69 000000"}
    text:
      de: "Bei Ankunft nach 22:00 Uhr liegt Ihre Schlüsselkarte im Schlüsselsafe neben dem Eingang. Den Code erhalten Sie am Anreisetag, sobald Ihre Buchung bestätigt ist. Bitte teilen Sie uns Ihre Ankunftszeit mit."
      en: "If you arrive after 22:00, your key card is in the key safe next to the entrance. You receive the code on the arrival day once your booking is verified. Please let us know your arrival time."
      ru: "При прибытии после 22:00 ваша ключ-карта находится в сейфе для ключей рядом со входом. Код вы получите в день заезда после проверки бронирования. Пожалуйста, сообщите нам время прибытия."
      uk: "Якщо ви прибуваєте після 22:00, ваша ключ-картка знаходиться в сейфі для ключів біля входу. Код ви отримаєте в день заїзду після перевірки бронювання. Будь ласка, повідомте нам час прибуття."
      tr: "22:00'den sonra varırsanız anahtar kartınız girişin yanındaki anahtar kasasındadır. Kodu, rezervasyonunuz doğrulandıktan sonra varış gününde alırsınız. Lütfen varış saatinizi bize bildirin."
      it: "In caso di arrivo dopo le 22:00 la Sua tessera chiave si trova nella cassetta delle chiavi accanto all'ingresso. Riceverà il codice il giorno di arrivo, una volta verificata la prenotazione. La preghiamo di comunicarci l'orario di arrivo."
  - key: late_arrival.key_safe_code
    sensitivity: verified_guest_only
    value: {code: "4711"}
    text:
      de: "Der Code des Schlüsselsafes lautet 4711. Der Safe befindet sich rechts neben der Eingangstür."
      en: "The key-safe code is 4711. The safe is to the right of the entrance door."
      ru: "Код сейфа для ключей: 4711. Сейф находится справа от входной двери."
      uk: "Код сейфа для ключів: 4711. Сейф розташований праворуч від вхідних дверей."
      tr: "Anahtar kasasının kodu 4711'dir. Kasa giriş kapısının sağındadır."
      it: "Il codice della cassetta delle chiavi è 4711. La cassetta si trova a destra della porta d'ingresso."
  - key: rooms
    value: {items: [{code: "ez", name: "Einzelzimmer", max_occupancy: 1}, {code: "dz", name: "Doppelzimmer", max_occupancy: 2}]}
    text:
      de: "Es gibt Einzelzimmer (1 Person) und Doppelzimmer (bis 2 Personen), alle mit Bad, WLAN und Schreibtisch."
      en: "There are single rooms (1 person) and double rooms (up to 2 persons), all with bathroom, Wi-Fi and desk."
      ru: "Есть одноместные номера (1 человек) и двухместные (до 2 человек), все с ванной, Wi-Fi и письменным столом."
      uk: "Є одномісні номери (1 особа) та двомісні (до 2 осіб), усі з ванною, Wi-Fi та письмовим столом."
      tr: "Tek kişilik odalar (1 kişi) ve çift kişilik odalar (en fazla 2 kişi) vardır; tümünde banyo, Wi-Fi ve çalışma masası bulunur."
      it: "Sono disponibili camere singole (1 persona) e camere doppie (fino a 2 persone), tutte con bagno, Wi-Fi e scrivania."
  - key: rates_policy
    value: {tax_inclusive: true, currency: "EUR", children: "Kinder bis 6 Jahre im Bett der Eltern kostenfrei", extra_bed: "on_request"}
    text:
      de: "Alle Preise verstehen sich inklusive Mehrwertsteuer. Kinder bis 6 Jahre übernachten im Bett der Eltern kostenfrei. Ein Zustellbett ist nur nach Rücksprache mit der Rezeption möglich."
      en: "All prices include VAT. Children up to 6 years stay free in their parents' bed. An extra bed is only possible after consultation with the reception."
      ru: "Все цены включают НДС. Дети до 6 лет размещаются бесплатно в кровати родителей. Дополнительная кровать возможна только по согласованию с ресепшен."
      uk: "Усі ціни включають ПДВ. Діти до 6 років розміщуються безкоштовно в ліжку батьків. Додаткове ліжко можливе лише за погодженням з рецепцією."
      tr: "Tüm fiyatlara KDV dahildir. 6 yaşına kadar çocuklar ebeveynlerinin yatağında ücretsiz konaklar. Ek yatak yalnızca resepsiyonla görüşülerek mümkündür."
      it: "Tutti i prezzi includono l'IVA. I bambini fino a 6 anni soggiornano gratuitamente nel letto dei genitori. Un letto supplementare è possibile solo previo accordo con la reception."
  - key: cancellation.flex
    value: {rate_plan: "flex", free_until_hours: 24}
    text:
      de: "Flexible Rate: Kostenlose Stornierung bis 18:00 Uhr am Tag vor der Anreise. Danach oder bei Nichtanreise wird die erste Nacht berechnet."
      en: "Flexible rate: free cancellation until 18:00 on the day before arrival. Afterwards, or in case of no-show, the first night is charged."
      ru: "Гибкий тариф: бесплатная отмена до 18:00 накануне дня заезда. После этого срока или при незаезде взимается стоимость первой ночи."
      uk: "Гнучкий тариф: безкоштовне скасування до 18:00 напередодні дня заїзду. Після цього або в разі незаїзду стягується вартість першої ночі."
      tr: "Esnek tarife: Varıştan önceki gün saat 18:00'e kadar ücretsiz iptal. Sonrasında veya gelinmemesi durumunda ilk gece ücreti alınır."
      it: "Tariffa flessibile: cancellazione gratuita fino alle 18:00 del giorno precedente l'arrivo. Successivamente, o in caso di mancato arrivo, viene addebitata la prima notte."
  - key: cancellation.nonrefundable
    value: {rate_plan: "nonrefundable"}
    text:
      de: "Nicht erstattbare Rate: Der gesamte Aufenthalt wird bei Buchung berechnet und ist nicht stornierbar oder erstattbar."
      en: "Non-refundable rate: the whole stay is charged at booking and cannot be cancelled or refunded."
      ru: "Невозвратный тариф: полная стоимость проживания списывается при бронировании и не подлежит отмене или возврату."
      uk: "Тариф без повернення: повна вартість проживання списується під час бронювання і не підлягає скасуванню чи поверненню."
      tr: "İade edilmez tarife: Konaklamanın tamamı rezervasyon sırasında tahsil edilir; iptal veya iade edilemez."
      it: "Tariffa non rimborsabile: l'intero soggiorno viene addebitato al momento della prenotazione e non può essere cancellato o rimborsato."
  - key: payment
    value: {methods: ["Visa", "Mastercard", "girocard", "Barzahlung"], deposit: "none", prepayment: "nonrefundable_only"}
    text:
      de: "Wir akzeptieren Visa, Mastercard, girocard und Barzahlung. Bei der flexiblen Rate zahlen Sie vor Ort; die nicht erstattbare Rate wird bei Buchung berechnet."
      en: "We accept Visa, Mastercard, girocard and cash. The flexible rate is paid on site; the non-refundable rate is charged at booking."
      ru: "Мы принимаем Visa, Mastercard, girocard и наличные. Гибкий тариф оплачивается на месте; невозвратный тариф списывается при бронировании."
      uk: "Ми приймаємо Visa, Mastercard, girocard і готівку. Гнучкий тариф оплачується на місці; тариф без повернення списується під час бронювання."
      tr: "Visa, Mastercard, girocard ve nakit kabul ediyoruz. Esnek tarife yerinde ödenir; iade edilmez tarife rezervasyon sırasında tahsil edilir."
      it: "Accettiamo Visa, Mastercard, girocard e contanti. La tariffa flessibile si paga in loco; la tariffa non rimborsabile viene addebitata al momento della prenotazione."
  - key: city_tax
    value: {rate_text: "2 EUR pro Person und Nacht (fixture)", exemptions: "handoff"}
    text:
      de: "In Frankfurt wird eine Tourismusbeitrag von 2 EUR pro Person und Nacht erhoben (Fixture-Wert, vom Hotel zu bestätigen). Fragen zu Ausnahmen, etwa für Geschäftsreisende, beantwortet die Rezeption."
      en: "Frankfurt charges a tourism levy of EUR 2 per person and night (fixture value, to be confirmed by the hotel). The reception answers questions about exemptions, for example for business travellers."
      ru: "Во Франкфурте взимается туристический сбор 2 EUR с человека за ночь (значение-fixture, подлежит подтверждению отелем). На вопросы об исключениях, например для деловых поездок, отвечает ресепшен."
      uk: "У Франкфурті стягується туристичний збір 2 EUR з особи за ніч (значення-fixture, підлягає підтвердженню готелем). На запитання про винятки, наприклад для ділових поїздок, відповідає рецепція."
      tr: "Frankfurt'ta kişi başı gece başına 2 EUR turizm katkı payı alınır (fixture değeri, otel tarafından teyit edilmelidir). Örneğin iş seyahatleri için muafiyetlerle ilgili soruları resepsiyon yanıtlar."
      it: "Francoforte applica un contributo turistico di 2 EUR a persona per notte (valore fixture, da confermare dall'hotel). Alle domande sulle esenzioni, ad esempio per i viaggi di lavoro, risponde la reception."
  - key: breakfast
    value: {from: "07:00", to: "10:00", price_cents: 1600, included: false, diet: "vegetarian, vegan and gluten-free options on request"}
    text:
      de: "Frühstück gibt es täglich von 07:00 bis 10:00 Uhr für 16 EUR pro Person. Vegetarische, vegane und glutenfreie Optionen sind auf Anfrage möglich; bitte sagen Sie der Rezeption am Vortag Bescheid."
      en: "Breakfast is served daily from 07:00 to 10:00 for EUR 16 per person. Vegetarian, vegan and gluten-free options are available on request; please tell the reception the day before."
      ru: "Завтрак подаётся ежедневно с 07:00 до 10:00 и стоит 16 EUR с человека. Вегетарианские, веганские и безглютеновые варианты доступны по запросу; пожалуйста, сообщите на ресепшен накануне."
      uk: "Сніданок подається щодня з 07:00 до 10:00 і коштує 16 EUR з особи. Вегетаріанські, веганські та безглютенові варіанти доступні за запитом; будь ласка, повідомте рецепцію напередодні."
      tr: "Kahvaltı her gün 07:00 ile 10:00 arasında kişi başı 16 EUR'ya servis edilir. Vejetaryen, vegan ve glütensiz seçenekler talep üzerine mümkündür; lütfen bir gün önceden resepsiyona bildirin."
      it: "La colazione è servita ogni giorno dalle 07:00 alle 10:00 al prezzo di 16 EUR a persona. Opzioni vegetariane, vegane e senza glutine sono disponibili su richiesta; La preghiamo di avvisare la reception il giorno prima."
  - key: parking
    value: {type: "garage", price_cents_per_night: 1800, clearance_m: 2.1, reservation: "on_request", spaces_total: 12}
    text:
      de: "Die hoteleigene Tiefgarage kostet 18 EUR pro Nacht; die Einfahrtshöhe beträgt 2,10 m. Es gibt 12 Stellplätze, eine Reservierung ist nur über die Rezeption möglich und wird nicht garantiert."
      en: "The hotel's underground garage costs EUR 18 per night; the clearance is 2.10 m. There are 12 spaces; a reservation is only possible through the reception and is not guaranteed."
      ru: "Подземный гараж отеля стоит 18 EUR за ночь; высота въезда 2,10 м. Всего 12 мест; бронирование возможно только через ресепшен и не гарантируется."
      uk: "Підземний гараж готелю коштує 18 EUR за ніч; висота в'їзду 2,10 м. Усього 12 місць; бронювання можливе лише через рецепцію і не гарантується."
      tr: "Otelin yer altı otoparkı gecelik 18 EUR'dur; giriş yüksekliği 2,10 m'dir. 12 park yeri vardır; rezervasyon yalnızca resepsiyon üzerinden mümkündür ve garanti edilmez."
      it: "Il garage sotterraneo dell'hotel costa 18 EUR a notte; l'altezza massima è 2,10 m. Ci sono 12 posti; la prenotazione è possibile solo tramite la reception e non è garantita."
  - key: pets
    value: {allowed: true, fee_cents_per_night: 1500, conditions: "one dog per room, not in the breakfast room"}
