      en: "By car: A5 to exit Frankfurt-Westend, then follow the signs to the city centre. The garage entrance is at Beispielstraße 1 (clearance 2.10 m)."
      ru: "На автомобиле: A5 до съезда Frankfurt-Westend, затем по указателям в центр. Въезд в гараж по адресу Beispielstraße 1 (высота 2,10 м)."
      uk: "Автомобілем: A5 до з'їзду Frankfurt-Westend, далі за вказівниками до центру. В'їзд до гаража за адресою Beispielstraße 1 (висота 2,10 м)."
      tr: "Arabayla: A5'ten Frankfurt-Westend çıkışına, ardından şehir merkezi tabelalarını takip edin. Otopark girişi Beispielstraße 1'dedir (yükseklik 2,10 m)."
      it: "In auto: A5 fino all'uscita Frankfurt-Westend, poi seguire le indicazioni per il centro. L'ingresso del garage è in Beispielstraße 1 (altezza 2,10 m)."
