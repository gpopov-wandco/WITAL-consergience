      uk: "Собаки вітаються: одна собака в номері за 15 EUR за ніч. У зал для сніданків із собаками не можна."
      tr: "Köpekler kabul edilir: oda başına bir köpek, gecelik 15 EUR. Kahvaltı salonuna köpek alınmaz."
      it: "I cani sono benvenuti: un cane per camera a 15 EUR a notte. I cani non sono ammessi nella sala colazioni."
  - key: extras
    text:
      de: "Auf Anfrage stellen wir ein Babybett kostenfrei bereit. Bügeleisen und Bügelbrett erhalten Sie an der Rezeption."
      en: "A cot is provided free of charge on request. Iron and ironing board are available at the reception."
      ru: "По запросу мы бесплатно предоставляем детскую кроватку. Утюг и гладильную доску можно получить на ресепшен."
      uk: "За запитом ми безкоштовно надаємо дитяче ліжечко. Праску та дошку для прасування можна отримати на рецепції."
      tr: "Talep üzerine ücretsiz bebek yatağı sağlanır. Ütü ve ütü masası resepsiyondan alınabilir."
      it: "Su richiesta forniamo gratuitamente una culla. Ferro e asse da stiro sono disponibili alla reception."
  - key: accessibility
    text:
      de: "Der Eingang ist stufenlos, ein Aufzug erreicht alle Etagen. Ein Zimmer im Erdgeschoss ist barrierearm; bitte fragen Sie die Rezeption nach Details."
      en: "The entrance is step-free and a lift serves all floors. One ground-floor room has reduced barriers; please ask the reception for details."
      ru: "Вход без ступеней, лифт обслуживает все этажи. Один номер на первом этаже имеет пониженные барьеры; за подробностями обратитесь на ресепшен."
      uk: "Вхід без сходинок, ліфт обслуговує всі поверхи. Один номер на першому поверсі має знижені бар'єри; за деталями зверніться на рецепцію."
      tr: "Giriş basamaksızdır ve asansör tüm katlara hizmet verir. Zemin kattaki bir oda engelleri azaltılmış şekildedir; ayrıntılar için resepsiyona sorun."
      it: "L'ingresso è privo di gradini e un ascensore serve tutti i piani. Una camera al piano terra ha barriere ridotte; per i dettagli chieda alla reception."
