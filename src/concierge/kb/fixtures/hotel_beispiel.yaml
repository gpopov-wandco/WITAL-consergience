    text:
      de: "Vom Flughafen Frankfurt fahren Sie mit der S-Bahn S8 oder S9 bis Hauptbahnhof (etwa 15 Minuten), dann 10 Minuten zu Fuß über die Beispielstraße. Ein Taxi braucht etwa 20 Minuten."
      en: "From Frankfurt Airport take the S-Bahn S8 or S9 to the main station (about 15 minutes), then walk 10 minutes along Beispielstraße. A taxi takes about 20 minutes."
      ru: "Из аэропорта Франкфурта езжайте на электричке S8 или S9 до главного вокзала (около 15 минут), затем 10 минут пешком по Beispielstraße. На такси около 20 минут."
      uk: "З аеропорту Франкфурта їдьте електричкою S8 або S9 до головного вокзалу (близько 15 хвилин), потім 10 хвилин пішки вздовж Beispielstraße. На таксі близько 20 хвилин."
      tr: "Frankfurt Havalimanı'ndan S8 veya S9 banliyö treniyle ana gara gidin (yaklaşık 15 dakika), ardından Beispielstraße boyunca 10 dakika yürüyün. Taksiyle yaklaşık 20 dakika sürer."
      it: "Dall'aeroporto di Francoforte prenda la S-Bahn S8 o S9 fino alla stazione centrale (circa 15 minuti), poi 10 minuti a piedi lungo la Beispielstraße. In taxi circa 20 minuti."
  - key: directions.hbf
