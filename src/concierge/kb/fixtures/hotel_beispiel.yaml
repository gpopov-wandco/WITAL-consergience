  - key: house_rules
    text:
      de: "Rauchen ist im gesamten Haus untersagt. Nachtruhe ist von 22:00 bis 07:00 Uhr. Besucher melden sich bitte an der Rezeption an."
      en: "Smoking is prohibited throughout the building. Quiet hours are from 22:00 to 07:00. Visitors please register at the reception."
      ru: "Курение запрещено во всём здании. Ночная тишина с 22:00 до 07:00. Посетители регистрируются на ресепшен."
      uk: "Куріння заборонене в усій будівлі. Нічна тиша з 22:00 до 07:00. Відвідувачі реєструються на рецепції."
      tr: "Binanın tamamında sigara içmek yasaktır. Sessizlik saatleri 22:00 ile 07:00 arasındadır. Ziyaretçiler lütfen resepsiyona kayıt yaptırsın."
      it: "È vietato fumare in tutto l'edificio. Il silenzio è dalle 22:00 alle 07:00. I visitatori sono pregati di registrarsi alla reception."
  - key: invoicing
    text:
      de: "Rechnungen stellt die Rezeption aus. Für eine Firmenrechnung nennen Sie bitte Firmenname, Anschrift und gegebenenfalls die Umsatzsteuer-ID; Änderungen an einer bereits ausgestellten Rechnung prüft die Rezeption."
      en: "Invoices are issued by the reception. For a company invoice please give the company name, address and VAT number if applicable; changes to an invoice already issued are checked by the reception."
      ru: "Счета выставляет ресепшен. Для счёта на компанию укажите название компании, адрес и при необходимости номер НДС; изменения уже выставленного счёта рассматривает ресепшен."
      uk: "Рахунки виставляє рецепція. Для рахунку на компанію вкажіть назву компанії, адресу та за потреби номер платника ПДВ; зміни до вже виставленого рахунку розглядає рецепція."
      tr: "Faturalar resepsiyon tarafından düzenlenir. Şirket faturası için lütfen şirket adını, adresini ve varsa KDV numarasını bildirin; düzenlenmiş bir faturadaki değişiklikleri resepsiyon inceler."
      it: "Le fatture sono emesse dalla reception. Per una fattura aziendale indichi ragione sociale, indirizzo ed eventuale partita IVA; le modifiche a una fattura già emessa sono verificate dalla reception."
  - key: lost_property
    text:
      de: "Fundsachen bewahren wir drei Monate auf. Bitte beschreiben Sie den Gegenstand und Ihre Aufenthaltsdaten; die Rezeption meldet sich."
      en: "Lost property is kept for three months. Please describe the item and your stay dates; the reception will get back to you."
      ru: "Забытые вещи хранятся три месяца. Опишите, пожалуйста, предмет и даты проживания; ресепшен свяжется с вами."
      uk: "Забуті речі зберігаються три місяці. Опишіть, будь ласка, предмет і дати проживання; рецепція зв'яжеться з вами."
      tr: "Kayıp eşyalar üç ay saklanır. Lütfen eşyayı ve konaklama tarihlerinizi belirtin; resepsiyon size dönecektir."
      it: "Gli oggetti smarriti sono conservati per tre mesi. Descriva l'oggetto e le date del soggiorno; la reception La ricontatterà."
  - key: emergency
    text:
      de: "Im Notfall wählen Sie 112 (Feuerwehr, Rettungsdienst) oder 110 (Polizei). Das Hotelteam ist rund um die Uhr über +49 69 000000 erreichbar. Fluchtpläne hängen auf jeder Etage."
      en: "In an emergency call 112 (fire, ambulance) or 110 (police). The hotel team can be reached around the clock at +49 69 000000. Escape plans are posted on every floor."
      ru: "В экстренной ситуации звоните 112 (пожарные, скорая) или 110 (полиция). Команда отеля доступна круглосуточно по телефону +49 69 000000. Планы эвакуации размещены на каждом этаже."
      uk: "У надзвичайній ситуації телефонуйте 112 (пожежна, швидка) або 110 (поліція). Команда готелю доступна цілодобово за телефоном +49 69 000000. Плани евакуації розміщені на кожному поверсі."
      tr: "Acil durumda 112 (itfaiye, ambulans) veya 110 (polis) numarasını arayın. Otel ekibine günün her saati +49 69 000000 numarasından ulaşılabilir. Kaçış planları her katta asılıdır."
      it: "In caso di emergenza chiami il 112 (vigili del fuoco, ambulanza) o il 110 (polizia). Il team dell'hotel è raggiungibile 24 ore su 24 al +49 69 000000. I piani di evacuazione sono affissi a ogni piano."
