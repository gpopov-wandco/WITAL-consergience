  - key: contact_hours
    value: {reception_hours: "07:00-22:00", phone: "+49 69 000000", email: "reception@example.invalid"}
    text:
      de: "Die Rezeption ist täglich von 07:00 bis 22:00 Uhr besetzt. Telefon +49 69 000000, E-Mail reception@example.invalid. Außerhalb dieser Zeiten erreichen Sie den Nachtdienst über die Notfallnummer an der Eingangstür."
