      en: "During the book fair from 14 to 18 October 2026 demand is high; in this period only the reception confirms prices and availability."
      ru: "Во время книжной ярмарки с 14 по 18 октября 2026 года спрос высокий; в этот период цены и наличие подтверждает только ресепшен."
      uk: "Під час книжкового ярмарку з 14 по 18 жовтня 2026 року попит високий; у цей період ціни та наявність підтверджує лише рецепція."
      tr: "14-18 Ekim 2026 tarihlerindeki kitap fuarı sırasında talep yüksektir; bu dönemde fiyat ve müsaitliği yalnızca resepsiyon teyit eder."
