# Hosted pre-check-in form texts (F15) in six languages. Legal explanations carry
# status draft_unreviewed (C10) and never claim compliance (C12). Nothing here is a
# hotel fact; the hotel name and dates arrive from the reservation.
version: 2026.09.29-1
status: draft_unreviewed
texts:
  de:
    title: "Meldeschein vorab ausfüllen"
    intro: "Nach dem Bundesmeldegesetz füllen Gäste am Anreisetag einen Meldeschein aus; für deutsche Staatsangehörige entfällt er seit dem 1. Januar 2025 (Angabe ohne Gewähr, Prüfung durch das Hotel). Dieses Formular fragt nur die gesetzlich vorgesehenen Angaben ab und dient ausschließlich der Meldepflicht. Der Ausweis wird beim Check-in vorgelegt."
    saved: "Ihre Angaben sind gespeichert. Die elektronische Bestätigung ist nur am Anreisetag möglich; danach löscht das Hotel die Daten fristgerecht."
    confirm_hint: "Am Anreisetag bestätigen Sie die Angaben elektronisch. Dazu wird eine kleine Betragsreservierung mit starker Kundenauthentifizierung durchgeführt und wieder freigegeben; es werden keine Kartendaten an das Hotel übertragen."
    not_arrival_day: "Die elektronische Bestätigung ist nur am Anreisetag möglich. Bitte versuchen Sie es am {arrival} erneut oder unterschreiben Sie den Meldeschein an der Rezeption."
    done: "Vielen Dank. Der Meldeschein ist bestätigt."
    privacy: "Die Daten werden verschlüsselt gespeichert, nicht für Werbung genutzt und ein Jahr nach der Abreise gelöscht."
    save: "Speichern"
    confirm: "Am Anreisetag elektronisch bestätigen"
    fields:
      arrival: "Anreise"
      departure: "Voraussichtliche Abreise"
      family_name: "Familienname"
      first_name: "Vorname"
      birth_date: "Geburtsdatum"
      nationalities: "Staatsangehörigkeit(en), durch Komma getrennt"
      address_street: "Straße und Hausnummer"
      address_postal_code: "Postleitzahl"
      address_city: "Ort"
      address_country: "Land (Ländercode, z. B. DE)"
      companions_count: "Zahl der mitreisenden ausländischen Personen"
      companions_nationality: "Staatsangehörigkeit der Mitreisenden"
      id_document_number: "Seriennummer des Passes oder Passersatzpapiers"
  en:
    title: "Pre-check-in registration form"
    intro: "Under the German Federal Registration Act guests complete a registration form on the day of arrival; German citizens have been exempt since 1 January 2025 (to be confirmed by the hotel). This form asks only for the details the law prescribes and serves the registration duty only. Your ID is presented at check-in."
    saved: "Your details are saved. Electronic confirmation is possible on the day of arrival only; afterwards the hotel deletes the data within the legal period."
    confirm_hint: "On the day of arrival you confirm the details electronically. A small amount is reserved with strong customer authentication and released again; no card data reaches the hotel."
    not_arrival_day: "Electronic confirmation is possible on the day of arrival only. Please try again on {arrival} or sign the form at the reception."
    done: "Thank you. The registration form is confirmed."
    privacy: "The data is stored encrypted, never used for marketing and deleted one year after departure."
    save: "Save"
    confirm: "Confirm electronically on the day of arrival"
    fields:
      arrival: "Arrival"
      departure: "Expected departure"
      family_name: "Family name"
      first_name: "First name"
      birth_date: "Date of birth"
      nationalities: "Nationality or nationalities, comma separated"
      address_street: "Street and number"
      address_postal_code: "Postal code"
      address_city: "City"
      address_country: "Country (code, for example DE)"
      companions_count: "Number of accompanying foreign persons"
      companions_nationality: "Nationality of the accompanying persons"
      id_document_number: "Serial number of the passport or substitute document"
  ru:
    title: "Регистрационная форма перед заездом"
    intro: "Согласно немецкому закону о регистрации гости заполняют регистрационную форму в день заезда; граждане Германии освобождены от неё с 1 января 2025 года (подтверждается отелем). Форма запрашивает только предусмотренные законом данные и служит исключительно обязанности регистрации. Документ предъявляется при заезде."
    saved: "Ваши данные сохранены. Электронное подтверждение возможно только в день заезда; затем отель удаляет данные в установленный срок."
    confirm_hint: "В день заезда вы подтверждаете данные электронно. Небольшая сумма резервируется с надёжной аутентификацией и затем освобождается; данные карты в отель не передаются."
    not_arrival_day: "Электронное подтверждение возможно только в день заезда. Повторите попытку {arrival} или подпишите форму на ресепшен."
    done: "Спасибо. Регистрационная форма подтверждена."
    privacy: "Данные хранятся в зашифрованном виде, не используются для рекламы и удаляются через год после выезда."
    save: "Сохранить"
    confirm: "Подтвердить электронно в день заезда"
    fields:
      arrival: "Заезд"
      departure: "Предполагаемый выезд"
      family_name: "Фамилия"
      first_name: "Имя"
      birth_date: "Дата рождения"
      nationalities: "Гражданство (через запятую)"
      address_street: "Улица и номер дома"
      address_postal_code: "Почтовый индекс"
      address_city: "Город"
      address_country: "Страна (код, например DE)"
      companions_count: "Число сопровождающих иностранных лиц"
      companions_nationality: "Гражданство сопровождающих"
      id_document_number: "Серийный номер паспорта или заменяющего документа"
  uk:
    title: "Реєстраційна форма перед заїздом"
    intro: "Згідно з німецьким законом про реєстрацію гості заповнюють реєстраційну форму в день заїзду; громадяни Німеччини звільнені від неї з 1 січня 2025 року (підтверджує готель). Форма запитує лише передбачені законом дані і слугує виключно обов'язку реєстрації. Документ пред'являється при заїзді."
    saved: "Ваші дані збережено. Електронне підтвердження можливе лише в день заїзду; потім готель видаляє дані у встановлений строк."
    confirm_hint: "У день заїзду ви підтверджуєте дані електронно. Невелика сума резервується з надійною автентифікацією і потім звільняється; дані картки до готелю не передаються."
    not_arrival_day: "Електронне підтвердження можливе лише в день заїзду. Спробуйте ще раз {arrival} або підпишіть форму на рецепції."
    done: "Дякуємо. Реєстраційну форму підтверджено."
    privacy: "Дані зберігаються в зашифрованому вигляді, не використовуються для реклами і видаляються через рік після виїзду."
    save: "Зберегти"
    confirm: "Підтвердити електронно в день заїзду"
    fields:
      arrival: "Заїзд"
      departure: "Очікуваний виїзд"
      family_name: "Прізвище"
      first_name: "Ім'я"
      birth_date: "Дата народження"
      nationalities: "Громадянство (через кому)"
      address_street: "Вулиця та номер будинку"
      address_postal_code: "Поштовий індекс"
      address_city: "Місто"
      address_country: "Країна (код, наприклад DE)"
      companions_count: "Кількість супровідних іноземних осіб"
      companions_nationality: "Громадянство супровідних осіб"
      id_document_number: "Серійний номер паспорта або замінного документа"
  tr:
    title: "Giriş öncesi kayıt formu"
    intro: "Alman Federal Kayıt Yasası'na göre misafirler giriş gününde bir kayıt formu doldurur; Alman vatandaşları 1 Ocak 2025'ten beri muaftır (otel tarafından teyit edilir). Bu form yalnızca yasanın öngördüğü bilgileri sorar ve yalnızca kayıt yükümlülüğüne hizmet eder. Kimlik girişte gösterilir."
    saved: "Bilgileriniz kaydedildi. Elektronik onay yalnızca giriş gününde mümkündür; ardından otel verileri yasal süre içinde siler."
    confirm_hint: "Giriş gününde bilgileri elektronik olarak onaylarsınız. Güçlü müşteri doğrulaması ile küçük bir tutar rezerve edilir ve tekrar serbest bırakılır; kart bilgileri otele iletilmez."
    not_arrival_day: "Elektronik onay yalnızca giriş gününde mümkündür. Lütfen {arrival} tarihinde tekrar deneyin veya formu resepsiyonda imzalayın."
    done: "Teşekkürler. Kayıt formu onaylandı."
    privacy: "Veriler şifreli saklanır, pazarlama için kullanılmaz ve çıkıştan bir yıl sonra silinir."
    save: "Kaydet"
    confirm: "Giriş gününde elektronik olarak onayla"
    fields:
      arrival: "Giriş"
      departure: "Beklenen çıkış"
      family_name: "Soyadı"
      first_name: "Adı"
      birth_date: "Doğum tarihi"
      nationalities: "Uyruk(lar), virgülle ayrılmış"
      address_street: "Sokak ve numara"
      address_postal_code: "Posta kodu"
      address_city: "Şehir"
      address_country: "Ülke (kod, örneğin DE)"
      companions_count: "Eşlik eden yabancı kişi sayısı"
      companions_nationality: "Eşlik eden kişilerin uyruğu"
      id_document_number: "Pasaport veya yerine geçen belgenin seri numarası"
  it:
    title: "Scheda di notifica prima del check-in"
    intro: "Secondo la legge federale tedesca sulla registrazione gli ospiti compilano una scheda di notifica il giorno dell'arrivo; i cittadini tedeschi ne sono esenti dal 1° gennaio 2025 (da confermare dall'hotel). Il modulo richiede solo i dati previsti dalla legge e serve esclusivamente all'obbligo di registrazione. Il documento viene esibito al check-in."
    saved: "I Suoi dati sono salvati. La conferma elettronica è possibile solo il giorno dell'arrivo; in seguito l'hotel cancella i dati nei termini di legge."
    confirm_hint: "Il giorno dell'arrivo conferma i dati elettronicamente. Un piccolo importo viene riservato con autenticazione forte del cliente e poi rilasciato; nessun dato della carta raggiunge l'hotel."
    not_arrival_day: "La conferma elettronica è possibile solo il giorno dell'arrivo. Riprovi il {arrival} oppure firmi la scheda alla reception."
    done: "Grazie. La scheda di notifica è confermata."
    privacy: "I dati sono conservati cifrati, mai usati per marketing e cancellati un anno dopo la partenza."
    save: "Salva"
    confirm: "Conferma elettronicamente il giorno dell'arrivo"
    fields:
      arrival: "Arrivo"
      departure: "Partenza prevista"
      family_name: "Cognome"
      first_name: "Nome"
      birth_date: "Data di nascita"
      nationalities: "Cittadinanza/e, separate da virgola"
      address_street: "Via e numero civico"
      address_postal_code: "CAP"
      address_city: "Città"
      address_country: "Paese (codice, ad esempio DE)"
      companions_count: "Numero di persone straniere al seguito"
      companions_nationality: "Cittadinanza delle persone al seguito"
      id_document_number: "Numero di serie del passaporto o del documento sostitutivo"
